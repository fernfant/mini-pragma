<svg viewBox="0 0 460 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The score, fix, re-score loop: read and score every page, fix the worst, then score again — repeat until the number stops moving.">
<rect width="460" height="230" fill="#fff"/>
<path d="M 300 70 A 120 120 0 0 1 330 150" fill="none" stroke="#b9410a" stroke-width="2.5"/>
<polygon points="333,143 336,156 324,152" fill="#b9410a"/>
<path d="M 330 178 A 120 120 0 0 1 130 178" fill="none" stroke="#b9410a" stroke-width="2.5"/>
<polygon points="135,184 124,178 134,171" fill="#b9410a"/>
<path d="M 128 150 A 120 120 0 0 1 160 70" fill="none" stroke="#b9410a" stroke-width="2.5"/>
<polygon points="166,75 156,66 152,79" fill="#b9410a"/>
<circle cx="230" cy="46" r="40" fill="#f6e9e1" stroke="#b9410a" stroke-width="2"/>
<text x="230" y="44" text-anchor="middle" fill="#242424" font-size="14" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Score</text>
<text x="230" y="60" text-anchor="middle" fill="#6b6b6b" font-size="9.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">read every page cold</text>
<circle cx="360" cy="150" r="40" fill="#f6e9e1" stroke="#b9410a" stroke-width="2"/>
<text x="360" y="148" text-anchor="middle" fill="#242424" font-size="14" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Fix</text>
<text x="360" y="164" text-anchor="middle" fill="#6b6b6b" font-size="9.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">worst-first</text>
<circle cx="100" cy="150" r="40" fill="#f6e9e1" stroke="#b9410a" stroke-width="2"/>
<text x="100" y="148" text-anchor="middle" fill="#242424" font-size="14" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Re-score</text>
<text x="100" y="164" text-anchor="middle" fill="#6b6b6b" font-size="9.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">check the delta</text>
<text x="230" y="120" text-anchor="middle" fill="#6b6b6b" font-size="11" font-style="italic" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">until the number</text>
<text x="230" y="134" text-anchor="middle" fill="#6b6b6b" font-size="11" font-style="italic" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">stops moving</text>
</svg>