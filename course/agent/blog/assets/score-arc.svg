<svg viewBox="0 0 720 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Line chart of the course average across versions: 86.6 at v3, 92.8 at v4, dipping to 92.2 when an 11th criterion was added, recovering to 93.2 after the pacing fixes.">
<rect width="720" height="270" fill="#fff"/>
<line x1="90" y1="112.0" x2="660" y2="112.0" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="660" y="104.0" text-anchor="end" fill="#2e7d32" font-size="12" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Exemplary ≥ 90</text>
<polyline points="90.0,173.2 280.0,61.6 470.0,72.4 660.0,54.4" fill="none" stroke="#b9410a" stroke-width="3" stroke-linejoin="round"/>
<circle cx="90.0" cy="173.2" r="6" fill="#b9410a"/>
<text x="90.0" y="159.2" text-anchor="middle" fill="#242424" font-size="15" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">86.6</text>
<text x="90.0" y="245" text-anchor="middle" fill="#242424" font-size="13" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">v3</text>
<text x="90.0" y="262" text-anchor="middle" fill="#6b6b6b" font-size="11" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">first full pass</text>
<circle cx="280.0" cy="61.6" r="6" fill="#b9410a"/>
<text x="280.0" y="47.6" text-anchor="middle" fill="#242424" font-size="15" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">92.8</text>
<text x="280.0" y="245" text-anchor="middle" fill="#242424" font-size="13" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">v4</text>
<text x="280.0" y="262" text-anchor="middle" fill="#6b6b6b" font-size="11" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">after fixes</text>
<circle cx="470.0" cy="72.4" r="6" fill="#6b6b6b"/>
<text x="470.0" y="98.4" text-anchor="middle" fill="#242424" font-size="15" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">92.2</text>
<text x="470.0" y="245" text-anchor="middle" fill="#242424" font-size="13" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">v5 ·</text>
<text x="470.0" y="262" text-anchor="middle" fill="#6b6b6b" font-size="11" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">+ stricter rule</text>
<circle cx="660.0" cy="54.4" r="6" fill="#b9410a"/>
<text x="660.0" y="40.4" text-anchor="middle" fill="#242424" font-size="15" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">93.2</text>
<text x="660.0" y="245" text-anchor="middle" fill="#242424" font-size="13" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">v5</text>
<text x="660.0" y="262" text-anchor="middle" fill="#6b6b6b" font-size="11" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">after pacing fixes</text>
</svg>