<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="ui-sans-serif, system-ui, sans-serif">
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #111; text-anchor: middle; }
    .sub { font-size: 13px; fill: #555; text-anchor: middle; }
    .panel-title { font-size: 15px; font-weight: 700; fill: #111; text-anchor: middle; }
    .word { font-size: 14px; font-weight: 600; fill: #fff; text-anchor: middle; }
    .label { font-size: 12px; fill: #333; text-anchor: middle; }
    .mem-label { font-size: 11px; font-style: italic; text-anchor: middle; }
  </style>

  <text x="450" y="32" class="title">The "telephone game" problem RNNs have — and Transformers don't</text>
  <text x="450" y="54" class="sub">Sentence: "The cat that the dog chased was scared"  ·  What was scared? (cat — 6 words back)</text>

  <!-- TOP: RNN memory fading -->
  <text x="450" y="90" class="panel-title">RNN: information about "cat" fades as it passes through each step</text>

  <g transform="translate(50, 110)">
    <!-- Words -->
    <rect x="0"   y="0" width="80" height="36" rx="5" fill="#ef4444"/><text x="40"  y="22" class="word">The</text>
    <rect x="100" y="0" width="80" height="36" rx="5" fill="#ef4444"/><text x="140" y="22" class="word">cat</text>
    <rect x="200" y="0" width="80" height="36" rx="5" fill="#ef4444"/><text x="240" y="22" class="word">that</text>
    <rect x="300" y="0" width="80" height="36" rx="5" fill="#ef4444"/><text x="340" y="22" class="word">the</text>
    <rect x="400" y="0" width="80" height="36" rx="5" fill="#ef4444"/><text x="440" y="22" class="word">dog</text>
    <rect x="500" y="0" width="80" height="36" rx="5" fill="#ef4444"/><text x="540" y="22" class="word">chased</text>
    <rect x="600" y="0" width="80" height="36" rx="5" fill="#ef4444"/><text x="640" y="22" class="word">was</text>
    <rect x="700" y="0" width="80" height="36" rx="5" fill="#ef4444"/><text x="740" y="22" class="word">scared?</text>

    <!-- Memory blobs below each, fading -->
    <!-- After step 2 (just saw "cat"), strong memory of cat -->
    <circle cx="140" cy="78" r="22" fill="#7c3aed" opacity="1.0"/>
    <text x="140" y="105" class="mem-label">"cat" 100%</text>

    <circle cx="240" cy="78" r="20" fill="#7c3aed" opacity="0.7"/>
    <text x="240" y="105" class="mem-label">"cat" 70%</text>

    <circle cx="340" cy="78" r="17" fill="#7c3aed" opacity="0.5"/>
    <text x="340" y="105" class="mem-label">"cat" 50%</text>

    <circle cx="440" cy="78" r="15" fill="#7c3aed" opacity="0.35"/>
    <text x="440" y="105" class="mem-label">"cat" 35%</text>

    <circle cx="540" cy="78" r="12" fill="#7c3aed" opacity="0.2"/>
    <text x="540" y="105" class="mem-label">"cat" 20%</text>

    <circle cx="640" cy="78" r="9" fill="#7c3aed" opacity="0.1"/>
    <text x="640" y="105" class="mem-label">"cat" 10%</text>

    <circle cx="740" cy="78" r="6" fill="#7c3aed" opacity="0.05"/>
    <text x="740" y="105" class="mem-label" style="fill:#b45309;font-weight:700">"cat" ~ 5%</text>

    <text x="740" y="138" class="label" style="fill:#b45309;font-weight:600">😕 Can't tell who "scared"</text>
    <text x="740" y="154" class="label" style="fill:#b45309">refers to</text>
  </g>

  <!-- DIVIDER -->
  <line x1="50" y1="290" x2="850" y2="290" stroke="#ddd" stroke-width="1.5"/>

  <!-- BOTTOM: Transformer attention direct link -->
  <text x="450" y="324" class="panel-title">Transformer: "scared" attention-arrows directly back to "cat", no fade</text>

  <g transform="translate(50, 344)">
    <!-- Words -->
    <rect x="0"   y="0" width="80" height="36" rx="5" fill="#3b82f6"/><text x="40"  y="22" class="word">The</text>
    <rect x="100" y="0" width="80" height="36" rx="5" fill="#3b82f6"/><text x="140" y="22" class="word">cat</text>
    <rect x="200" y="0" width="80" height="36" rx="5" fill="#3b82f6"/><text x="240" y="22" class="word">that</text>
    <rect x="300" y="0" width="80" height="36" rx="5" fill="#3b82f6"/><text x="340" y="22" class="word">the</text>
    <rect x="400" y="0" width="80" height="36" rx="5" fill="#3b82f6"/><text x="440" y="22" class="word">dog</text>
    <rect x="500" y="0" width="80" height="36" rx="5" fill="#3b82f6"/><text x="540" y="22" class="word">chased</text>
    <rect x="600" y="0" width="80" height="36" rx="5" fill="#3b82f6"/><text x="640" y="22" class="word">was</text>
    <rect x="700" y="0" width="80" height="36" rx="5" fill="#3b82f6"/><text x="740" y="22" class="word">scared</text>

    <!-- Direct attention arrow from "scared" back to "cat" -->
    <path d="M 740 0 Q 440 -45 140 0" stroke="#1d4ed8" stroke-width="3" fill="none" marker-end="url(#arr-direct)"/>
    <defs>
      <marker id="arr-direct" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
      </marker>
    </defs>
    <text x="440" y="-50" class="label" style="fill:#1d4ed8;font-weight:700">direct attention — full strength</text>

    <text x="140" y="78" class="mem-label" style="fill:#047857;font-weight:700">"cat" — 100%</text>
    <text x="740" y="78" class="mem-label" style="fill:#047857;font-weight:700">sees "cat" — 100%</text>

    <text x="450" y="106" class="label" style="fill:#047857;font-weight:600">😊 "scared" knows it refers to "cat" — no information lost</text>
  </g>
</svg>
