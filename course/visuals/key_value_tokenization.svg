<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="ui-sans-serif, system-ui, sans-serif">
  <style>
    .title { font-size: 22px; font-weight: 700; fill: #111; text-anchor: middle; }
    .panel-title { font-size: 16px; font-weight: 700; fill: #111; text-anchor: middle; }
    .sub { font-size: 13px; fill: #555; text-anchor: middle; }
    .mono { font-family: ui-monospace, monospace; font-size: 13px; fill: #111; }
    .key-tok { fill: #3b82f6; }
    .val-tok { fill: #10b981; }
    .num-tok { fill: #ef4444; }
    .note { font-size: 12px; fill: #b45309; }
    .good { font-size: 12px; fill: #047857; }
    .arrow { stroke: #555; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <text x="500" y="32" class="title">Plain-text tokenisation vs. key-value tokenisation (PRAGMA's trick)</text>

  <!-- INPUT EVENT (shared) -->
  <rect x="320" y="60" width="360" height="80" rx="8" fill="#fafafa" stroke="#ddd" stroke-width="1.5"/>
  <text x="500" y="86" class="panel-title">A banking event (the raw data)</text>
  <text x="500" y="108" class="mono" text-anchor="middle">Type: card_payment</text>
  <text x="500" y="126" class="mono" text-anchor="middle">Amount: 14.99,  Currency: gbp</text>

  <line x1="500" y1="140" x2="500" y2="170" class="arrow"/>
  <text x="500" y="186" class="sub" style="font-weight:600">Now: how do we turn this into tokens for the model?</text>

  <!-- LEFT: PLAIN TEXT -->
  <text x="240" y="220" class="panel-title">❌ Naive: serialise to text, then tokenise</text>

  <rect x="40" y="240" width="400" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="240" y="260" class="mono" text-anchor="middle">"Type: card_payment, Amount: 14.99, Currency: gbp"</text>
  <text x="240" y="280" class="sub">(joined into a sentence)</text>

  <line x1="240" y1="290" x2="240" y2="310" class="arrow"/>

  <rect x="40" y="318" width="400" height="80" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="50" y="340" class="mono">[</text>
  <text x="60"  y="340" class="mono key-tok">"Type"</text>
  <text x="100" y="340" class="mono">,</text>
  <text x="108" y="340" class="mono val-tok">"card"</text>
  <text x="140" y="340" class="mono val-tok">"_"</text>
  <text x="150" y="340" class="mono val-tok">"payment"</text>
  <text x="206" y="340" class="mono">,</text>
  <text x="214" y="340" class="mono key-tok">"Amount"</text>
  <text x="264" y="340" class="mono">,</text>
  <text x="50"  y="360" class="mono num-tok">"1"</text>
  <text x="65"  y="360" class="mono num-tok">"4"</text>
  <text x="80"  y="360" class="mono num-tok">"."</text>
  <text x="92"  y="360" class="mono num-tok">"9"</text>
  <text x="106" y="360" class="mono num-tok">"9"</text>
  <text x="124" y="360" class="mono">,</text>
  <text x="132" y="360" class="mono key-tok">"Currency"</text>
  <text x="195" y="360" class="mono">,</text>
  <text x="203" y="360" class="mono val-tok">"gbp"</text>
  <text x="233" y="360" class="mono">]</text>
  <text x="50" y="385" class="mono" style="font-weight:700;fill:#b45309">14 tokens. Wasteful.</text>

  <text x="240" y="425" class="note" text-anchor="middle">⚠ "14.99" became 5 separate digit-tokens</text>
  <text x="240" y="443" class="note" text-anchor="middle">⚠ The model has to RE-LEARN that 1·4·.·9·9 = a number</text>
  <text x="240" y="461" class="note" text-anchor="middle">⚠ Numerical order is gone (no clue 14 &gt; 5)</text>
  <text x="240" y="479" class="note" text-anchor="middle">⚠ Every record bloats. Slow. Hard to scale.</text>

  <!-- RIGHT: KEY-VALUE STRUCTURED -->
  <text x="760" y="220" class="panel-title">✓ PRAGMA: structured key-value pairs</text>

  <rect x="560" y="240" width="400" height="50" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
  <text x="760" y="262" class="mono" text-anchor="middle">[ (key, value, time) triples ]</text>
  <text x="760" y="280" class="sub">(keep the structure)</text>

  <line x1="760" y1="290" x2="760" y2="310" class="arrow"/>

  <rect x="560" y="318" width="400" height="80" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="570" y="340" class="mono">[</text>
  <text x="580" y="340" class="mono key-tok">[Type]</text>
  <text x="620" y="340" class="mono val-tok">[card_payment]</text>
  <text x="715" y="340" class="mono">,</text>
  <text x="730" y="340" class="mono key-tok">[Amount]</text>
  <text x="785" y="340" class="mono val-tok">[bucket_42]</text>
  <text x="855" y="340" class="mono">,</text>

  <text x="570" y="360" class="mono key-tok">[Currency]</text>
  <text x="630" y="360" class="mono val-tok">[gbp]</text>
  <text x="660" y="360" class="mono">]</text>
  <text x="570" y="385" class="mono" style="font-weight:700;fill:#047857">6 tokens. Compact.</text>

  <text x="760" y="425" class="good" text-anchor="middle">✓ Each field = 1 key token + 1 value token</text>
  <text x="760" y="443" class="good" text-anchor="middle">✓ Numbers go to "percentile buckets" (bucket_42)</text>
  <text x="760" y="461" class="good" text-anchor="middle">✓ Buckets are ordered — 14.99 lands in bucket "around 40-50%"</text>
  <text x="760" y="479" class="good" text-anchor="middle">✓ Half the tokens. Numbers stay numbers.</text>

  <!-- Bottom takeaway -->
  <text x="500" y="520" class="sub" style="font-weight:700;fill:#111">Same fill-in-the-blank game. But now hiding "Amount: ____" tells the model "predict a number bucket", not "guess any subword".</text>
</svg>
