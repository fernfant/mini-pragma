<svg viewBox="0 0 780 460" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="mk-arrow-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="mk-arrow-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#10b981"/>
    </marker>
  </defs>

  <text x="390" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">
    Where the knobs actually sit (drawn for 4 hidden units)
  </text>

  <!-- Column titles -->
  <text x="80"  y="60" text-anchor="middle" font-size="12" fill="#888" font-style="italic">INPUT</text>
  <text x="320" y="60" text-anchor="middle" font-size="12" fill="#888" font-style="italic">4 HIDDEN UNITS</text>
  <text x="600" y="60" text-anchor="middle" font-size="12" fill="#888" font-style="italic">OUTPUT</text>

  <!-- Input node -->
  <circle cx="80" cy="240" r="22" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="80" y="246" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">x</text>

  <!-- Hidden unit positions -->
  <!-- y centers: 100, 190, 280, 370 -->
  <g>
    <!-- arrows from x to each hidden unit (the layer1 WEIGHTS w_i, blue) -->
    <line x1="100" y1="232" x2="290" y2="108" stroke="#3b82f6" stroke-width="2" marker-end="url(#mk-arrow-w)"/>
    <line x1="100" y1="236" x2="290" y2="190" stroke="#3b82f6" stroke-width="2" marker-end="url(#mk-arrow-w)"/>
    <line x1="100" y1="244" x2="290" y2="280" stroke="#3b82f6" stroke-width="2" marker-end="url(#mk-arrow-w)"/>
    <line x1="100" y1="248" x2="290" y2="362" stroke="#3b82f6" stroke-width="2" marker-end="url(#mk-arrow-w)"/>
    <!-- w_i labels on arrows -->
    <text x="170" y="160" font-size="11.5" font-weight="700" fill="#3b82f6">w₁</text>
    <text x="180" y="208" font-size="11.5" font-weight="700" fill="#3b82f6">w₂</text>
    <text x="180" y="270" font-size="11.5" font-weight="700" fill="#3b82f6">w₃</text>
    <text x="170" y="320" font-size="11.5" font-weight="700" fill="#3b82f6">w₄</text>
  </g>

  <!-- The 4 hidden units (circles) -->
  <g>
    <circle cx="320" cy="100" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="320" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">h₁</text>
    <circle cx="320" cy="190" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="320" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">h₂</text>
    <circle cx="320" cy="280" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="320" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">h₃</text>
    <circle cx="320" cy="370" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="320" y="376" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">h₄</text>
  </g>

  <!-- Bias chips for each hidden unit (amber) -->
  <g font-size="10.5" font-weight="700">
    <rect x="350" y="92"  width="40" height="18" rx="9" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="370" y="105" text-anchor="middle" fill="#92400e">+b₁</text>
    <rect x="350" y="182" width="40" height="18" rx="9" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="370" y="195" text-anchor="middle" fill="#92400e">+b₂</text>
    <rect x="350" y="272" width="40" height="18" rx="9" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="370" y="285" text-anchor="middle" fill="#92400e">+b₃</text>
    <rect x="350" y="362" width="40" height="18" rx="9" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="370" y="375" text-anchor="middle" fill="#92400e">+b₄</text>
  </g>

  <!-- arrows from each hidden unit to output (the layer2 WEIGHTS c_i, green) -->
  <g>
    <line x1="392" y1="100" x2="565" y2="232" stroke="#10b981" stroke-width="2" marker-end="url(#mk-arrow-c)"/>
    <line x1="392" y1="190" x2="565" y2="234" stroke="#10b981" stroke-width="2" marker-end="url(#mk-arrow-c)"/>
    <line x1="392" y1="280" x2="565" y2="244" stroke="#10b981" stroke-width="2" marker-end="url(#mk-arrow-c)"/>
    <line x1="392" y1="370" x2="565" y2="252" stroke="#10b981" stroke-width="2" marker-end="url(#mk-arrow-c)"/>
    <!-- c_i labels -->
    <text x="465" y="148" font-size="11.5" font-weight="700" fill="#047857">c₁</text>
    <text x="475" y="200" font-size="11.5" font-weight="700" fill="#047857">c₂</text>
    <text x="475" y="280" font-size="11.5" font-weight="700" fill="#047857">c₃</text>
    <text x="465" y="332" font-size="11.5" font-weight="700" fill="#047857">c₄</text>
  </g>

  <!-- Output node -->
  <circle cx="600" cy="240" r="24" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
  <text x="600" y="247" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">y</text>

  <!-- output bias chip -->
  <rect x="630" y="232" width="58" height="18" rx="9" fill="#fce7f3" stroke="#a855f7"/>
  <text x="659" y="245" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7e22ce">+ b_out</text>

  <!-- Legend / counter at bottom -->
  <g transform="translate(20, 405)">
    <rect x="0" y="0" width="740" height="42" rx="8" fill="#f8fafc" stroke="#e5e5e5"/>
    <text x="14" y="18" font-size="12" font-weight="700" fill="#1a1a1a">Counting the knobs:</text>
    <text x="14" y="34" font-size="11.5" fill="#444">
      <tspan fill="#3b82f6" font-weight="700">4 input arrows w₁…w₄</tspan>  +
      <tspan fill="#92400e" font-weight="700"> 4 hidden biases b₁…b₄</tspan>  +
      <tspan fill="#047857" font-weight="700"> 4 output arrows c₁…c₄</tspan>  +
      <tspan fill="#7e22ce" font-weight="700"> 1 output bias b_out</tspan>  =  <tspan font-weight="700">13 knobs total</tspan>   (the code uses 8 units, so 3×8 + 1 = <tspan font-weight="700">25</tspan>).
    </text>
  </g>
</svg>
