<svg viewBox="0 0 840 360" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="pl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
  </defs>

  <text x="420" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">
    An MLP is a pipeline — watch the shape change at every stage.
  </text>

  <!-- Stage 1: input x -->
  <g transform="translate(20, 60)">
    <text x="50" y="0"  text-anchor="middle" font-size="11" font-weight="700" fill="#888">INPUT</text>
    <rect x="10" y="14" width="80" height="60" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="50" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">x</text>
    <text x="50" y="62" text-anchor="middle" font-size="10" fill="#92400e">one input number</text>
    <text x="50" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#555">shape (1)</text>
    <text x="50" y="114" text-anchor="middle" font-size="10" fill="#888">no knobs</text>
  </g>
  <line x1="110" y1="104" x2="148" y2="104" stroke="#555" stroke-width="2" marker-end="url(#pl-arrow)"/>

  <!-- Stage 2: Linear 1 -->
  <g transform="translate(150, 60)">
    <text x="60" y="0"  text-anchor="middle" font-size="11" font-weight="700" fill="#3b82f6">LAYER 1 · Linear</text>
    <rect x="0" y="14" width="120" height="60" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="60" y="34" text-anchor="middle" font-size="11" fill="#1d4ed8">multiply by 8 weights</text>
    <text x="60" y="50" text-anchor="middle" font-size="11" fill="#1d4ed8">add 8 biases</text>
    <text x="60" y="66" text-anchor="middle" font-size="10" fill="#1d4ed8">transforms 1 → 8</text>
    <text x="60" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#555">+ 16 knobs</text>
    <text x="60" y="114" text-anchor="middle" font-size="10" fill="#888">(8 w + 8 b)</text>
  </g>
  <line x1="270" y1="104" x2="308" y2="104" stroke="#555" stroke-width="2" marker-end="url(#pl-arrow)"/>

  <!-- Stage 3: hidden h -->
  <g transform="translate(310, 60)">
    <text x="40" y="0"  text-anchor="middle" font-size="11" font-weight="700" fill="#888">HIDDEN</text>
    <rect x="0" y="14" width="80" height="60" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
    <text x="40" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">h</text>
    <text x="40" y="58" text-anchor="middle" font-size="10" fill="#555">8 numbers</text>
    <text x="40" y="68" text-anchor="middle" font-size="10" fill="#555">(could be negative)</text>
    <text x="40" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#555">shape (8)</text>
    <text x="40" y="114" text-anchor="middle" font-size="10" fill="#888">no knobs</text>
  </g>
  <line x1="390" y1="104" x2="428" y2="104" stroke="#555" stroke-width="2" marker-end="url(#pl-arrow)"/>

  <!-- Stage 4: ReLU -->
  <g transform="translate(430, 60)">
    <text x="50" y="0"  text-anchor="middle" font-size="11" font-weight="700" fill="#a855f7">ReLU (activation)</text>
    <rect x="0" y="14" width="100" height="60" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
    <text x="50" y="36" text-anchor="middle" font-size="11" fill="#7e22ce">if number &lt; 0:</text>
    <text x="50" y="51" text-anchor="middle" font-size="11" fill="#7e22ce">turn it to 0</text>
    <text x="50" y="67" text-anchor="middle" font-size="10" fill="#7e22ce">(adds the bend)</text>
    <text x="50" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#555">shape (8)</text>
    <text x="50" y="114" text-anchor="middle" font-size="10" fill="#888">+ 0 knobs</text>
  </g>
  <line x1="530" y1="104" x2="568" y2="104" stroke="#555" stroke-width="2" marker-end="url(#pl-arrow)"/>

  <!-- Stage 5: Linear 2 -->
  <g transform="translate(570, 60)">
    <text x="60" y="0"  text-anchor="middle" font-size="11" font-weight="700" fill="#3b82f6">LAYER 2 · Linear</text>
    <rect x="0" y="14" width="120" height="60" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="60" y="34" text-anchor="middle" font-size="11" fill="#1d4ed8">multiply by 8 weights</text>
    <text x="60" y="50" text-anchor="middle" font-size="11" fill="#1d4ed8">add 1 bias</text>
    <text x="60" y="66" text-anchor="middle" font-size="10" fill="#1d4ed8">transforms 8 → 1</text>
    <text x="60" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#555">+ 9 knobs</text>
    <text x="60" y="114" text-anchor="middle" font-size="10" fill="#888">(8 w + 1 b)</text>
  </g>
  <line x1="690" y1="104" x2="728" y2="104" stroke="#555" stroke-width="2" marker-end="url(#pl-arrow)"/>

  <!-- Stage 6: output y -->
  <g transform="translate(730, 60)">
    <text x="45" y="0"  text-anchor="middle" font-size="11" font-weight="700" fill="#888">OUTPUT</text>
    <rect x="5" y="14" width="80" height="60" rx="10" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
    <text x="45" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">y</text>
    <text x="45" y="62" text-anchor="middle" font-size="10" fill="#047857">the prediction</text>
    <text x="45" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#555">shape (1)</text>
    <text x="45" y="114" text-anchor="middle" font-size="10" fill="#888">no knobs</text>
  </g>

  <!-- bracket showing knob total -->
  <path d="M150 220 L150 234 L688 234 L688 220" fill="none" stroke="#a1a1aa" stroke-width="1.4"/>
  <text x="420" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">
    Total knobs in the network: <tspan fill="#1d4ed8">16</tspan> + <tspan fill="#a855f7">0</tspan> + <tspan fill="#1d4ed8">9</tspan> = <tspan fill="#047857">25</tspan>
  </text>
  <text x="420" y="270" text-anchor="middle" font-size="11.5" fill="#666">
    ReLU has no parameters — only the Linear layers carry knobs.
  </text>

  <!-- Shape journey strip -->
  <g transform="translate(150, 290)">
    <text x="0" y="0" font-size="11.5" font-weight="700" fill="#444">Shape journey:</text>
    <text x="100" y="0" font-size="11.5" font-family="ui-monospace,monospace" fill="#1d4ed8">(1) → (8) → (8) → (1)</text>
    <text x="100" y="18" font-size="11" fill="#666">Each Linear changes the shape. ReLU keeps it the same.</text>
  </g>
</svg>
