<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="ui-sans-serif, system-ui, sans-serif">
  <style>
    .title { font-size: 22px; font-weight: 700; fill: #111; text-anchor: middle; }
    .panel-title { font-size: 17px; font-weight: 700; fill: #111; text-anchor: middle; }
    .sub { font-size: 13px; fill: #555; text-anchor: middle; }
    .word { font-size: 14px; font-weight: 600; fill: #fff; text-anchor: middle; }
    .step-label { font-size: 11px; fill: #666; text-anchor: middle; font-style: italic; }
    .arrow-seq { stroke: #ef4444; stroke-width: 2; fill: none; marker-end: url(#arr-red); }
    .arrow-attn { stroke: #3b82f6; stroke-width: 1.2; fill: none; marker-end: url(#arr-blue); opacity: 0.55; }
    .arrow-self { stroke: #1d4ed8; stroke-width: 1.5; fill: none; marker-end: url(#arr-blue); }
    .timer { font-size: 12px; fill: #b45309; font-weight: 700; text-anchor: middle; }
    .timer-good { font-size: 12px; fill: #047857; font-weight: 700; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <text x="500" y="32" class="title">Why Transformers won: speed and direct access</text>

  <!-- TOP PANEL: RNN -->
  <text x="500" y="74" class="panel-title">Before (RNN/LSTM): read one word at a time, pass a "memory" forward</text>

  <g transform="translate(80, 100)">
    <!-- Words as boxes -->
    <rect x="0"   y="0" width="100" height="46" rx="6" fill="#ef4444"/>
    <text x="50"  y="28" class="word">"The"</text>

    <rect x="160" y="0" width="100" height="46" rx="6" fill="#ef4444"/>
    <text x="210" y="28" class="word">"cat"</text>

    <rect x="320" y="0" width="100" height="46" rx="6" fill="#ef4444"/>
    <text x="370" y="28" class="word">"chased"</text>

    <rect x="480" y="0" width="100" height="46" rx="6" fill="#ef4444"/>
    <text x="530" y="28" class="word">"the"</text>

    <rect x="640" y="0" width="100" height="46" rx="6" fill="#ef4444"/>
    <text x="690" y="28" class="word">"mouse"</text>

    <!-- Sequential arrows -->
    <line x1="100" y1="23" x2="160" y2="23" class="arrow-seq"/>
    <line x1="260" y1="23" x2="320" y2="23" class="arrow-seq"/>
    <line x1="420" y1="23" x2="480" y2="23" class="arrow-seq"/>
    <line x1="580" y1="23" x2="640" y2="23" class="arrow-seq"/>

    <!-- "memory" boxes below -->
    <text x="50"  y="82" class="step-label">memory v1</text>
    <text x="210" y="82" class="step-label">memory v2</text>
    <text x="370" y="82" class="step-label">memory v3</text>
    <text x="530" y="82" class="step-label">memory v4</text>
    <text x="690" y="82" class="step-label">memory v5</text>

    <!-- time markers -->
    <text x="50"  y="106" class="timer">t = 1</text>
    <text x="210" y="106" class="timer">t = 2</text>
    <text x="370" y="106" class="timer">t = 3</text>
    <text x="530" y="106" class="timer">t = 4</text>
    <text x="690" y="106" class="timer">t = 5</text>

    <text x="370" y="148" class="sub">Total time: 5 sequential steps. Cannot start step 5 until step 4 is done.</text>
    <text x="370" y="166" class="sub" style="fill:#b45309;font-weight:600">"mouse" tries to remember "cat" through 4 hops of compressed memory — info fades.</text>
  </g>

  <!-- DIVIDER -->
  <line x1="80" y1="300" x2="920" y2="300" stroke="#ddd" stroke-width="1.5"/>

  <!-- BOTTOM PANEL: TRANSFORMER -->
  <text x="500" y="334" class="panel-title">Now (Transformer): all words processed in parallel, every word can look at every other word directly</text>

  <g transform="translate(80, 360)">
    <!-- Words as boxes -->
    <rect x="0"   y="0" width="100" height="46" rx="6" fill="#3b82f6"/>
    <text x="50"  y="28" class="word">"The"</text>

    <rect x="160" y="0" width="100" height="46" rx="6" fill="#3b82f6"/>
    <text x="210" y="28" class="word">"cat"</text>

    <rect x="320" y="0" width="100" height="46" rx="6" fill="#3b82f6"/>
    <text x="370" y="28" class="word">"chased"</text>

    <rect x="480" y="0" width="100" height="46" rx="6" fill="#3b82f6"/>
    <text x="530" y="28" class="word">"the"</text>

    <rect x="640" y="0" width="100" height="46" rx="6" fill="#3b82f6"/>
    <text x="690" y="28" class="word">"mouse"</text>

    <!-- Curved arrows: every word looks at every other word (showing some, not all 25, for clarity) -->
    <!-- mouse looks back at cat -->
    <path d="M 690 0 Q 450 -50 210 0" class="arrow-attn"/>
    <!-- mouse looks back at chased -->
    <path d="M 690 0 Q 530 -30 370 0" class="arrow-attn"/>
    <!-- cat looks forward at mouse -->
    <path d="M 210 46 Q 450 90 690 46" class="arrow-attn"/>
    <!-- the looks at cat -->
    <path d="M 50 46 Q 130 80 210 46" class="arrow-attn"/>
    <!-- chased looks at cat -->
    <path d="M 370 0 Q 290 -30 210 0" class="arrow-attn"/>
    <!-- the(2nd) looks at mouse -->
    <path d="M 530 46 Q 610 80 690 46" class="arrow-attn"/>

    <!-- time markers -->
    <text x="50"  y="106" class="timer-good">t = 1</text>
    <text x="210" y="106" class="timer-good">t = 1</text>
    <text x="370" y="106" class="timer-good">t = 1</text>
    <text x="530" y="106" class="timer-good">t = 1</text>
    <text x="690" y="106" class="timer-good">t = 1</text>

    <text x="370" y="146" class="sub" style="fill:#047857;font-weight:600">Total time: 1 step. All 5 words processed in parallel.</text>
    <text x="370" y="166" class="sub">"mouse" sees "cat" directly, no hops. Long-range information is just as accessible as short-range.</text>
  </g>
</svg>
