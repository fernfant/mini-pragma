<svg viewBox="0 0 920 460" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="av-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#666"/>
    </marker>
  </defs>

  <text x="460" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">
    The two moves a Transformer does, over and over: ATTENTION and FEED-FORWARD
  </text>
  <text x="460" y="40" text-anchor="middle" font-size="12" fill="#555">
    Same example sentence: <tspan font-family="ui-monospace,monospace" font-weight="700">"the dog says bark"</tspan> (4 token-vectors)
  </text>

  <!-- =================== LEFT PANEL: ATTENTION =================== -->
  <g transform="translate(20, 70)">
    <rect x="0" y="0" width="420" height="370" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
    <text x="210" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">ATTENTION — mixes across tokens</text>
    <text x="210" y="42" text-anchor="middle" font-size="12" fill="#1e3a8a">every token looks at every other token</text>

    <!-- 4 input vectors -->
    <g transform="translate(0, 60)">
      <g transform="translate(35, 0)"><rect x="0" y="0" width="60" height="48" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="30" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">the</text><text x="30" y="38" text-anchor="middle" font-size="9" fill="#888">vec</text></g>
      <g transform="translate(125, 0)"><rect x="0" y="0" width="60" height="48" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="30" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">dog</text><text x="30" y="38" text-anchor="middle" font-size="9" fill="#888">vec</text></g>
      <g transform="translate(215, 0)"><rect x="0" y="0" width="60" height="48" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="30" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">says</text><text x="30" y="38" text-anchor="middle" font-size="9" fill="#888">vec</text></g>
      <g transform="translate(305, 0)"><rect x="0" y="0" width="60" height="48" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="30" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">bark</text><text x="30" y="38" text-anchor="middle" font-size="9" fill="#888">vec</text></g>
    </g>

    <!-- Crisscross arrows showing every-to-every mixing -->
    <g stroke="#3b82f6" stroke-width="1.2" opacity="0.55" fill="none">
      <!-- All pairs of arrows in the mixing zone -->
      <path d="M65 120 C 100 160, 250 200, 245 235"/>
      <path d="M65 120 C 130 160, 320 200, 335 235"/>
      <path d="M155 120 C 130 160, 90 200, 65 235"/>
      <path d="M155 120 C 200 160, 280 200, 335 235"/>
      <path d="M245 120 C 200 160, 90 200, 65 235"/>
      <path d="M245 120 C 250 160, 230 200, 155 235"/>
      <path d="M335 120 C 280 160, 200 200, 155 235"/>
      <path d="M335 120 C 270 160, 110 200, 65 235"/>
      <!-- self-loops curving back to same column -->
      <path d="M65 120 C 35 160, 35 200, 65 235"/>
      <path d="M155 120 C 125 160, 125 200, 155 235"/>
      <path d="M245 120 C 215 160, 215 200, 245 235"/>
      <path d="M335 120 C 365 160, 365 200, 335 235"/>
    </g>
    <text x="210" y="180" text-anchor="middle" font-size="11" fill="#1d4ed8" font-style="italic" font-weight="600">
      <tspan x="210" dy="0">every-to-every</tspan>
      <tspan x="210" dy="14">(weighted blend)</tspan>
    </text>

    <!-- 4 output vectors (post-attention) -->
    <g transform="translate(0, 245)">
      <g transform="translate(35, 0)"><rect x="0" y="0" width="60" height="48" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/><text x="30" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">the</text><text x="30" y="36" text-anchor="middle" font-size="9" fill="#1d4ed8">+ context</text></g>
      <g transform="translate(125, 0)"><rect x="0" y="0" width="60" height="48" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/><text x="30" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">dog</text><text x="30" y="36" text-anchor="middle" font-size="9" fill="#1d4ed8">+ context</text></g>
      <g transform="translate(215, 0)"><rect x="0" y="0" width="60" height="48" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/><text x="30" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">says</text><text x="30" y="36" text-anchor="middle" font-size="9" fill="#1d4ed8">+ context</text></g>
      <g transform="translate(305, 0)"><rect x="0" y="0" width="60" height="48" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/><text x="30" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">bark</text><text x="30" y="36" text-anchor="middle" font-size="9" fill="#1d4ed8">+ context</text></g>
    </g>

    <text x="210" y="338" text-anchor="middle" font-size="12" fill="#1e3a8a">Each output vector now carries info</text>
    <text x="210" y="354" text-anchor="middle" font-size="12" fill="#1e3a8a">from ALL the other words.</text>
  </g>

  <!-- =================== RIGHT PANEL: FFN =================== -->
  <g transform="translate(480, 70)">
    <rect x="0" y="0" width="420" height="370" rx="12" fill="#f0fdf4" stroke="#10b981" stroke-width="1.8"/>
    <text x="210" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">FEED-FORWARD — processes within each token</text>
    <text x="210" y="42" text-anchor="middle" font-size="12" fill="#064e3b">each token handled by its own little MLP, alone</text>

    <!-- 4 input vectors -->
    <g transform="translate(0, 60)">
      <g transform="translate(35, 0)"><rect x="0" y="0" width="60" height="48" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/><text x="30" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">the</text><text x="30" y="38" text-anchor="middle" font-size="9" fill="#1d4ed8">+ context</text></g>
      <g transform="translate(125, 0)"><rect x="0" y="0" width="60" height="48" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/><text x="30" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">dog</text><text x="30" y="38" text-anchor="middle" font-size="9" fill="#1d4ed8">+ context</text></g>
      <g transform="translate(215, 0)"><rect x="0" y="0" width="60" height="48" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/><text x="30" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">says</text><text x="30" y="38" text-anchor="middle" font-size="9" fill="#1d4ed8">+ context</text></g>
      <g transform="translate(305, 0)"><rect x="0" y="0" width="60" height="48" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/><text x="30" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">bark</text><text x="30" y="38" text-anchor="middle" font-size="9" fill="#1d4ed8">+ context</text></g>
    </g>

    <!-- 4 parallel MLP boxes — NO cross-arrows -->
    <g transform="translate(0, 130)">
      <g transform="translate(35, 0)">
        <line x1="30" y1="0" x2="30" y2="14" stroke="#666" stroke-width="1.4" marker-end="url(#av-arr)"/>
        <rect x="0" y="14" width="60" height="62" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
        <text x="30" y="34" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">MLP</text>
        <text x="30" y="50" text-anchor="middle" font-size="10" fill="#047857">Linear</text>
        <text x="30" y="62" text-anchor="middle" font-size="10" fill="#047857">→ GELU</text>
        <text x="30" y="74" text-anchor="middle" font-size="10" fill="#047857">→ Linear</text>
        <line x1="30" y1="76" x2="30" y2="92" stroke="#666" stroke-width="1.4" marker-end="url(#av-arr)"/>
      </g>
      <g transform="translate(125, 0)">
        <line x1="30" y1="0" x2="30" y2="14" stroke="#666" stroke-width="1.4" marker-end="url(#av-arr)"/>
        <rect x="0" y="14" width="60" height="62" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
        <text x="30" y="34" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">MLP</text>
        <text x="30" y="50" text-anchor="middle" font-size="10" fill="#047857">Linear</text>
        <text x="30" y="62" text-anchor="middle" font-size="10" fill="#047857">→ GELU</text>
        <text x="30" y="74" text-anchor="middle" font-size="10" fill="#047857">→ Linear</text>
        <line x1="30" y1="76" x2="30" y2="92" stroke="#666" stroke-width="1.4" marker-end="url(#av-arr)"/>
      </g>
      <g transform="translate(215, 0)">
        <line x1="30" y1="0" x2="30" y2="14" stroke="#666" stroke-width="1.4" marker-end="url(#av-arr)"/>
        <rect x="0" y="14" width="60" height="62" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
        <text x="30" y="34" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">MLP</text>
        <text x="30" y="50" text-anchor="middle" font-size="10" fill="#047857">Linear</text>
        <text x="30" y="62" text-anchor="middle" font-size="10" fill="#047857">→ GELU</text>
        <text x="30" y="74" text-anchor="middle" font-size="10" fill="#047857">→ Linear</text>
        <line x1="30" y1="76" x2="30" y2="92" stroke="#666" stroke-width="1.4" marker-end="url(#av-arr)"/>
      </g>
      <g transform="translate(305, 0)">
        <line x1="30" y1="0" x2="30" y2="14" stroke="#666" stroke-width="1.4" marker-end="url(#av-arr)"/>
        <rect x="0" y="14" width="60" height="62" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
        <text x="30" y="34" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">MLP</text>
        <text x="30" y="50" text-anchor="middle" font-size="10" fill="#047857">Linear</text>
        <text x="30" y="62" text-anchor="middle" font-size="10" fill="#047857">→ GELU</text>
        <text x="30" y="74" text-anchor="middle" font-size="10" fill="#047857">→ Linear</text>
        <line x1="30" y1="76" x2="30" y2="92" stroke="#666" stroke-width="1.4" marker-end="url(#av-arr)"/>
      </g>
    </g>
    <text x="210" y="180" text-anchor="middle" font-size="11" fill="#047857" font-style="italic">no arrows between MLPs ↓ no cross-talk</text>

    <!-- 4 output vectors -->
    <g transform="translate(0, 245)">
      <g transform="translate(35, 0)"><rect x="0" y="0" width="60" height="48" rx="6" fill="#bbf7d0" stroke="#10b981" stroke-width="1.5"/><text x="30" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">the</text><text x="30" y="36" text-anchor="middle" font-size="9" fill="#047857">refined</text></g>
      <g transform="translate(125, 0)"><rect x="0" y="0" width="60" height="48" rx="6" fill="#bbf7d0" stroke="#10b981" stroke-width="1.5"/><text x="30" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">dog</text><text x="30" y="36" text-anchor="middle" font-size="9" fill="#047857">refined</text></g>
      <g transform="translate(215, 0)"><rect x="0" y="0" width="60" height="48" rx="6" fill="#bbf7d0" stroke="#10b981" stroke-width="1.5"/><text x="30" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">says</text><text x="30" y="36" text-anchor="middle" font-size="9" fill="#047857">refined</text></g>
      <g transform="translate(305, 0)"><rect x="0" y="0" width="60" height="48" rx="6" fill="#bbf7d0" stroke="#10b981" stroke-width="1.5"/><text x="30" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">bark</text><text x="30" y="36" text-anchor="middle" font-size="9" fill="#047857">refined</text></g>
    </g>

    <text x="210" y="338" text-anchor="middle" font-size="12" fill="#064e3b">Each token cleaned up on its own,</text>
    <text x="210" y="354" text-anchor="middle" font-size="12" fill="#064e3b">without "seeing" the others.</text>
  </g>
</svg>
