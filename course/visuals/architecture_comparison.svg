<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="ui-sans-serif, system-ui, sans-serif">
  <style>
    .title { font-size: 22px; font-weight: 700; fill: #111; text-anchor: middle; }
    .sub { font-size: 14px; fill: #666; text-anchor: middle; }
    .label { font-size: 14px; fill: #111; text-anchor: middle; }
    .knob { font-size: 12px; fill: #b45309; text-anchor: middle; font-weight: 600; }
    .total { font-size: 14px; font-weight: 700; fill: #111; text-anchor: middle; }
    .box-fill-1 { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; }
    .box-fill-2 { fill: #dbeafe; stroke: #3b82f6; stroke-width: 2; }
    .box-fill-3 { fill: #f3e8ff; stroke: #a855f7; stroke-width: 2; }
    .box-data { fill: #f5f5f5; stroke: #999; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="450" y="32" class="title">Same training loop. Different architectures. Different number of knobs.</text>

  <!-- MODEL A -->
  <text x="150" y="68" class="title" style="font-size:18px">Model A: Linear regression</text>
  <text x="150" y="88" class="sub">y = w·x + b</text>

  <rect x="90" y="110" width="120" height="36" rx="6" class="box-data"/>
  <text x="150" y="132" class="label">input x</text>

  <line x1="150" y1="146" x2="150" y2="180" class="arrow"/>

  <rect x="60" y="184" width="180" height="56" rx="8" class="box-fill-1"/>
  <text x="150" y="208" class="label">multiply by w, add b</text>
  <text x="150" y="228" class="knob">🔧 2 knobs (w, b)</text>

  <line x1="150" y1="244" x2="150" y2="278" class="arrow"/>

  <rect x="90" y="282" width="120" height="36" rx="6" class="box-data"/>
  <text x="150" y="304" class="label">output y</text>

  <rect x="40" y="340" width="220" height="100" rx="10" fill="#fafafa" stroke="#ddd" stroke-width="1.5"/>
  <text x="150" y="364" class="label" style="font-weight:600">Total knobs: 2</text>
  <text x="150" y="386" class="sub">Learns: y = 2x + 1</text>
  <text x="150" y="408" class="sub">Trains in: 100 steps</text>
  <text x="150" y="428" class="sub">Loss type: MSE</text>

  <!-- MODEL B -->
  <text x="450" y="68" class="title" style="font-size:18px">Model B: Embedding + classifier</text>
  <text x="450" y="88" class="sub">id → embedding → linear → scores</text>

  <rect x="390" y="110" width="120" height="36" rx="6" class="box-data"/>
  <text x="450" y="132" class="label">word id</text>

  <line x1="450" y1="146" x2="450" y2="180" class="arrow"/>

  <rect x="360" y="184" width="180" height="56" rx="8" class="box-fill-2"/>
  <text x="450" y="208" class="label">embedding lookup</text>
  <text x="450" y="228" class="knob">🔧 6 knobs (3×2 table)</text>

  <line x1="450" y1="244" x2="450" y2="268" class="arrow"/>

  <rect x="360" y="272" width="180" height="56" rx="8" class="box-fill-2"/>
  <text x="450" y="296" class="label">linear projection</text>
  <text x="450" y="316" class="knob">🔧 6 knobs (2×3 matrix)</text>

  <line x1="450" y1="332" x2="450" y2="356" class="arrow"/>

  <rect x="380" y="360" width="140" height="36" rx="6" class="box-data"/>
  <text x="450" y="382" class="label">sound scores</text>

  <rect x="340" y="418" width="220" height="100" rx="10" fill="#fafafa" stroke="#ddd" stroke-width="1.5"/>
  <text x="450" y="442" class="label" style="font-weight:600">Total knobs: 12</text>
  <text x="450" y="464" class="sub">Learns: dog→bark, cat→meow,</text>
  <text x="450" y="482" class="sub">fish→swim</text>
  <text x="450" y="504" class="sub">Trains in: 400 steps · Loss: Cross-entropy</text>

  <!-- TRANSFORMER -->
  <text x="750" y="68" class="title" style="font-size:18px">Transformer (Lesson 4)</text>
  <text x="750" y="88" class="sub">Model B + attention + feed-forward</text>

  <rect x="690" y="110" width="120" height="36" rx="6" class="box-data"/>
  <text x="750" y="132" class="label">word ids</text>

  <line x1="750" y1="146" x2="750" y2="170" class="arrow"/>

  <rect x="660" y="174" width="180" height="46" rx="8" class="box-fill-3"/>
  <text x="750" y="194" class="label">embedding lookup</text>
  <text x="750" y="212" class="knob">🔧 many knobs</text>

  <line x1="750" y1="224" x2="750" y2="248" class="arrow"/>

  <rect x="660" y="252" width="180" height="46" rx="8" class="box-fill-3"/>
  <text x="750" y="272" class="label">ATTENTION ⭐</text>
  <text x="750" y="290" class="knob">🔧 many more knobs</text>

  <line x1="750" y1="302" x2="750" y2="326" class="arrow"/>

  <rect x="660" y="330" width="180" height="46" rx="8" class="box-fill-3"/>
  <text x="750" y="350" class="label">feed-forward</text>
  <text x="750" y="368" class="knob">🔧 many more knobs</text>

  <line x1="750" y1="380" x2="750" y2="404" class="arrow"/>

  <rect x="660" y="408" width="180" height="44" rx="8" class="box-fill-3"/>
  <text x="750" y="430" class="label">output head</text>
  <text x="750" y="446" class="knob">🔧 vocab-many knobs</text>

  <line x1="750" y1="456" x2="750" y2="476" class="arrow"/>

  <rect x="680" y="478" width="140" height="36" rx="6" class="box-data"/>
  <text x="750" y="500" class="label">word predictions</text>

  <rect x="640" y="536" width="220" height="20" rx="6" fill="#fafafa" stroke="#ddd" stroke-width="1.5"/>
  <text x="750" y="551" class="label" style="font-weight:600">Total knobs: ~5,000 (toy) → 1 BILLION (PRAGMA-L)</text>
</svg>
