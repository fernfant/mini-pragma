<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-sans-serif, system-ui, sans-serif">
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #111; text-anchor: middle; }
    .axis-label { font-size: 14px; fill: #333; text-anchor: middle; font-weight: 600; }
    .point-label { font-size: 13px; fill: #111; font-weight: 600; }
    .annotation { font-size: 13px; fill: #555; }
    .arrow-strong { stroke: #ef4444; stroke-width: 3; fill: none; marker-end: url(#arr-red); }
    .arrow-thin { stroke: #555; stroke-width: 1.5; fill: none; marker-end: url(#arr-gray); }
    .grid { stroke: #eee; stroke-width: 1; }
    .curve { fill: none; stroke: #3b82f6; stroke-width: 3; }
    .tangent { stroke: #ef4444; stroke-width: 2; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <text x="400" y="32" class="title">Gradient = slope = "which way is downhill"</text>

  <!-- Axes -->
  <line x1="100" y1="430" x2="700" y2="430" stroke="#111" stroke-width="2"/>
  <line x1="100" y1="80" x2="100" y2="430" stroke="#111" stroke-width="2"/>

  <text x="400" y="465" class="axis-label">value of a weight (e.g., w)</text>
  <text x="35" y="255" class="axis-label" transform="rotate(-90 35 255)">loss</text>

  <!-- The parabola: loss = (w - 4)^2 + 1, shifted -->
  <!-- domain: w from 0 (x=100) to 8 (x=700); range: loss 0 to 17 (y=430 to 80) -->
  <!-- (w - 4)^2 + 1 evaluated: w=0 → 17, w=4 → 1, w=8 → 17 -->
  <path d="M 100 80
           Q 175 250, 250 195
           Q 325 145, 400 122
           Q 475 145, 550 195
           Q 625 250, 700 80"
        class="curve"/>

  <!-- Starting point: w=1, loss=10 (high), x=175, y=287 -->
  <circle cx="175" cy="287" r="8" fill="#3b82f6" stroke="#fff" stroke-width="2"/>
  <text x="180" y="278" class="point-label">START: w = 1, loss ≈ 10</text>

  <!-- Tangent line at starting point (steep negative slope) -->
  <line x1="135" y1="227" x2="215" y2="347" class="tangent"/>

  <!-- "Slope = gradient" annotation -->
  <text x="135" y="217" class="annotation">slope = gradient</text>
  <text x="135" y="232" class="annotation" style="fill:#ef4444;font-weight:700">≈ −6 (steep down)</text>

  <!-- Arrow showing nudge direction -->
  <line x1="175" y1="320" x2="245" y2="320" class="arrow-strong"/>
  <text x="220" y="340" class="annotation" style="fill:#ef4444;font-weight:600">nudge w this way</text>
  <text x="195" y="358" class="annotation" style="fill:#ef4444">(opposite of gradient)</text>

  <!-- Bottom of curve -->
  <circle cx="400" cy="122" r="8" fill="#10b981" stroke="#fff" stroke-width="2"/>
  <text x="405" y="115" class="point-label">GOAL: w = 4, loss ≈ 1</text>

  <!-- Tangent at goal (flat) -->
  <line x1="360" y1="122" x2="440" y2="122" class="tangent" style="stroke:#10b981"/>
  <text x="320" y="105" class="annotation" style="fill:#10b981;font-weight:600">slope ≈ 0 (we're done!)</text>

  <!-- Side note -->
  <rect x="500" y="280" width="270" height="130" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="635" y="305" class="point-label" style="text-anchor:middle">📐 The update rule</text>
  <text x="635" y="328" class="annotation" style="text-anchor:middle;font-family:ui-monospace,monospace">new_w = old_w − lr · gradient</text>
  <text x="635" y="354" class="annotation" style="text-anchor:middle">gradient negative → w increases</text>
  <text x="635" y="372" class="annotation" style="text-anchor:middle">gradient positive → w decreases</text>
  <text x="635" y="390" class="annotation" style="text-anchor:middle">gradient ≈ 0 → barely moves</text>
</svg>
